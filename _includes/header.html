<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Penguin Coders home">
      <img class="brand__mark" src="{{ '/assets/images/penguin-coders-mark.svg' | relative_url }}" alt="">
      <span class="brand__name">Penguin <span>Coders</span></span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Articles</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>

    <div class="header-tools">
      <a class="icon-link search-link" href="{{ '/blog/?focus=search' | relative_url }}" aria-label="Search articles" title="Search articles">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.8"/><path d="m13 13 4.2 4.2"/></svg>
      </a>
      <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="theme-toggle__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.8v2M10 16.2v2M18.2 10h-2M3.8 10h-2m14-5.8-1.4 1.4m-8.8 8.8-1.4 1.4m11.6 0-1.4-1.4m-8.8-8.8L4.2 4.2"/></svg>
      </button>
    </div>

    <details class="mobile-nav">
      <summary aria-label="Open navigation menu"><span class="mobile-nav__icon" aria-hidden="true"></span></summary>
      <nav class="mobile-nav__panel" aria-label="Mobile navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/blog/?focus=search' | relative_url }}">Search articles</a>
        <button class="mobile-theme-toggle" type="button">Switch theme</button>
      </nav>
    </details>
  </div>
</header>
